    "oce-2": {
      gradient: "gradient-4",
      title: "GEO 优化入门：如何让你的内容在 AI 搜索引擎中脱颖而出",
      meta: 'Ocebase<span class="dot"></span>2027.07<span class="dot"></span>GEO 服务',
      content: '\
        <h3>什么是 GEO？</h3>\
        <p>GEO（Generative Engine Optimization，生成式引擎优化）是针对 AI 搜索引擎（如 Perplexity、Google SGE、Bing Copilot）的内容优化策略。与传统 SEO 不同，GEO 更关注内容的语义结构、权威性和可引用性。</p>\
        \
        <h3>GEO 与 SEO 的核心区别</h3>\
        <ul>\
          <li>SEO 面向爬虫索引，GEO 面向大模型理解</li>\
          <li>SEO 追求关键词排名，GEO 追求被 AI 引用</li>\
          <li>SEO 依赖链接权重，GEO 依赖内容质量和结构化</li>\
        </ul>\
        \
        <h3>GEO 优化核心策略</h3>\
        <ul>\
          <li>结构化内容：使用清晰的标题层级和列表格式</li>\
          <li>事实性陈述：提供具体数据、引用来源，增强可信度</li>\
          <li>语义完整性：确保段落自包含，便于 AI 提取</li>\
          <li>权威信号：作者信息、专业背景、引用文献</li>\
        </ul>\
        \
        <h3>实操建议</h3>\
        <p>从内容创作入手，每篇文章确保有明确的问题定义、解决方案和总结。使用 Schema.org 标记增强结构化数据。定期监控 AI 搜索引擎中的引用情况，迭代优化内容策略。</p>\
      '

    "oce-3": {

      meta: 'Ocebase<span class="dot"></span>2027.07<span class="dot"></span>GEO 服务',
      content: '\
        <h3>搜索范式的变迁</h3>\
        <p>随着 ChatGPT、Perplexity、Google SGE 等生成式搜索工具的崛起，用户获取信息的方式正在发生根本性变化。从"关键词搜索 → 链接点击"的模式，转向"自然语言提问 → AI 生成答案"的模式。</p>\
        \
        <h3>传统 SEO 的局限</h3>\
        <ul>\
          <li>关键词堆砌在 AI 搜索中不再有效</li>\
          <li>排名靠前不等于被 AI 引用</li>\
          <li>用户越来越倾向于直接获取答案而非点击链接</li>\
        </ul>\
        \
        <h3>GEO 时代的应对策略</h3>\
        <ul>\
          <li>内容深度 > 关键词密度：提供有价值的原创分析</li>\
          <li>结构化表达：让 AI 更容易理解和提取你的内容</li>\
          <li>多模态覆盖：图文结合，增加被引用的概率</li>\
          <li>品牌权威性建设：建立行业信任度</li>\
        </ul>\
        \
        <h3>未来展望</h3>\
        <p>GEO 并非取代 SEO，而是 SEO 的进化。未来的内容策略需要同时兼顾传统搜索引擎和生成式引擎，实现双轨优化。企业应尽早布局 GEO，在 AI 搜索时代抢占先机。</p>\
      '
